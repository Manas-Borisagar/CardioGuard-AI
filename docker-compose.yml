version: '3.8'

services:
  # 1. Project Pulse ML & Static Frontend Service
  project-pulse-app:
    build: .
    container_name: project_pulse_core
    restart: unless-stopped
    environment:
      - PORT=8000
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp

  # 2. Cloudflare Zero Trust Tunnel Daemon
  # Connects outbound to Cloudflare's Edge — no open ports needed on your router/firewall
  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared_tunnel
    restart: unless-stopped
    depends_on:
      - project-pulse-app
    # If using a Named Tunnel with token:
    # command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    # If testing with Quick Tunnel (generates a free https://*.trycloudflare.com URL):
    command: tunnel --no-autoupdate --url http://project-pulse-app:8000
